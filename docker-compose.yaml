services:
  inventory-postgres:
    image: postgres:18
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: samar
      POSTGRES_PASSWORD: samar
    ports:
      - "5435:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-inventory-service:local
    container_name: ecommerce-inventory-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: "jdbc:postgresql://host.docker.internal:5435/inventory_db"
      DB_USERNAME: "${DB_USERNAME:-samar}"
      DB_PASSWORD: "${DB_PASSWORD:-samar}"
      RABBITMQ_HOST: "host.docker.internal"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:-guest}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-guest}"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      BUGSNAG_API_KEY: "${BUGSNAG_API_KEY:-}"

volumes:
  inventory_postgres_data: