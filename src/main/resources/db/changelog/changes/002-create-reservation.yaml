databaseChangeLog:

  - changeSet:
      id: 002-create-reservations
      author: samar

      changes:

        - createTable:
            tableName: reservation
            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_reservation

              - column:
                  name: request_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_reservation_request_id

              - column:
                  name: inventory_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reservation
            baseColumnNames: inventory_id
            constraintName: fk_reservation_inventory
            referencedTableName: inventory
            referencedColumnNames: id
            onDelete: CASCADE

        - sql:
            sql: >
              ALTER TABLE reservation
              ADD CONSTRAINT chk_reservation_quantity_positive
              CHECK (quantity > 0);

        - sql:
            sql: >
              ALTER TABLE reservation
              ADD CONSTRAINT chk_reservation_status
              CHECK (status IN ('RESERVED', 'RELEASED'));

        - createIndex:
            tableName: reservation
            indexName: idx_reservation_inventory_id
            columns:
              - column:
                  name: inventory_id