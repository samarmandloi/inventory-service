databaseChangeLog:

  - changeSet:
      id: 001-create-inventory
      author: samar

      changes:

        - createTable:
            tableName: inventory
            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: variant_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: sku
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: reserved_quantity
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: >
              ALTER TABLE inventory
              ADD CONSTRAINT chk_inventory_quantity_non_negative
              CHECK (quantity >= 0)

        - sql:
            sql: >
              ALTER TABLE inventory
              ADD CONSTRAINT chk_inventory_reserved_quantity_non_negative
              CHECK (reserved_quantity >= 0)

        - sql:
            sql: >
              ALTER TABLE inventory
              ADD CONSTRAINT chk_inventory_reserved_not_greater_than_quantity
              CHECK (reserved_quantity <= quantity)